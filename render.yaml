services:
  - type: web
    name: controlai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: CONTROLAI_SECURE_COOKIE
        value: "1"
      - key: CONTROLAI_BACKEND
        value: supabase
