<script>
const ST=["Previsto","Reservado","A caminho","Enviado","Instalado"],COMPRA=["Previsto","Reservado"],KEY="ctrl_obras_v1";
let S={estoque:[],dataEst:"",obras:[],itens:[],nid:1},aba="est",obraSel=null,tipoSel="Todos",msg="",pendDel=null;

const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function proximoId(){
 const usados=[...S.obras,...S.itens].map(x=>Number(x.id)).filter(Number.isSafeInteger);
 const maior=usados.reduce((max,id)=>Math.max(max,id),0);
 const contador=Number(S.nid);
 const id=Math.max(maior+1,Number.isSafeInteger(contador)&&contador>0?contador:1);
 if(!Number.isSafeInteger(id)||!Number.isSafeInteger(id+1))throw Error("Limite de identificadores atingido.");
 S.nid=id+1;return id;
}
const save=()=>salvarServidor();
const flash=t=>{msg=t;render()};
const tabela=(c,r)=>`<div class="sc"><table><tr>${c.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${r.map(l=>`<tr>${l.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${c.length}" class="mu">Nada por aqui ainda.</td></tr>`}</table></div>`;

/* ---------- leitura do export do Supra ---------- */
function biff(ab){const d=new DataView(ab),u=new Uint8Array(ab),dec=new TextDecoder("windows-1252"),c={};let i=0,R=0,C=0;
 while(i+4<=u.length){const op=d.getUint16(i,true),ln=d.getUint16(i+2,true),p=i+4;
  if(p+ln<=u.length&&((op==4&&ln>=8)||(op==3&&ln>=15)||(op==2&&ln>=9))){const r=d.getUint16(p,true),k=d.getUint16(p+2,true);let v;
   if(op==4)v=dec.decode(u.subarray(p+8,p+8+u[p+7]));else if(op==3)v=d.getFloat64(p+7,true);else v=d.getUint16(p+7,true);
   c[r+","+k]=v;R=Math.max(R,r+1);C=Math.max(C,k+1)}
  i+=4+ln}
 return Array.from({length:R},(_,r)=>Array.from({length:C},(_,k)=>c[r+","+k]))}
const cabNormal=value=>String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const cabCod=["codigo","cod","codigoproduto","codigodoproduto"];
const cabProd=["produto","descricao","descricaoproduto","descricaodoproduto","material"];
const achaCab=rows=>rows.findIndex(r=>r&&r.some(v=>cabCod.includes(cabNormal(v)))&&r.some(v=>cabProd.includes(cabNormal(v))));
async function linhas(f){const ab=await f.arrayBuffer(),u=new Uint8Array(ab);
 if(window.XLSX){
  try{
   const wb=XLSX.read(ab,{type:"array"});
   const candidatas=wb.SheetNames.map(nome=>({nome,rows:XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:null})})).filter(s=>achaCab(s.rows)>=0);
   if(candidatas.length>1)throw new Error("há mais de uma aba de estoque: "+candidatas.map(s=>s.nome).join(", ")+". Exporte uma aba por arquivo para evitar somar o mesmo estoque duas vezes");
   if(candidatas.length===1)return candidatas[0].rows;
  }catch(error){if(error.message.startsWith("há mais"))throw error;}
 }
 // Compatibilidade com o formato BIFF antigo, somente quando o arquivo tem BOF BIFF.
 if(u[0]===9&&u[1]===0){try{const rows=biff(ab);if(achaCab(rows)>=0)return rows;}catch(_){} }
 if(!window.XLSX)throw new Error("o leitor Excel não carregou. Verifique a conexão e tente novamente");
 throw new Error("não encontrei uma aba com as colunas Código e Produto/Descrição");
}
function saldoPlanilha(value,linha){
 if(value===null||value===undefined||String(value).trim()==="")return 0;
 if(typeof value==="number"&&Number.isFinite(value))return value;
 let text=String(value).trim().replace(/\s/g,"");
 if(text.includes(","))text=text.replace(/\./g,"").replace(",",".");
 else if(/^[+-]?\d{1,3}(?:\.\d{3})+$/.test(text))text=text.replace(/\./g,"");
 if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(text)||!Number.isFinite(Number(text)))throw new Error("saldo inválido na linha "+linha+". A importação não foi aplicada");
 return Number(text);
}
function extrair(rows){const t=achaCab(rows);if(t<0)throw new Error("não encontrei as colunas Código e Produto/Descrição");
 const h=rows[t].map(cabNormal),ix=names=>names.map(n=>h.indexOf(n)).find(i=>i>=0)??-1;
 const [cC,cP,cU,cF,cCF,cCl]=[cabCod,cabProd,["und","un","unidade"],["fabricante","marca"],["codfabricante","codigofabricante","codigodofabricante","modelo"],["classificacao","categoria"]].map(ix);
 let cSaldo=ix(["saldoatual","saldofisico","saldo","quantidade","qtd","qtde"]);
 if(cSaldo<0)cSaldo=h.findIndex(n=>n.startsWith("saldo"));
 // Relatório Supra: saldo inicial e final compartilham o título “Estoque em:”.
 // A data fica na linha seguinte; a coluna à direita é o saldo final.
 if(cSaldo<0){const estoque=h.map((name,i)=>name==="estoqueem"?i:-1).filter(i=>i>=0);cSaldo=estoque.at(-1)??-1;}
 if(cSaldo<0)cSaldo=rows[t].findIndex(n=>/^\d{2}[/-]\d{2}[/-]\d{2,4}$/.test(String(n??"").trim()));
 if(cSaldo<0)throw new Error("não identifiquei a coluna de saldo/quantidade. Nenhum saldo foi substituído");
 const out=[];
 for(let index=t+1;index<rows.length;index++){
  const r=rows[index]||[],raw=r[cC],cod=String(raw??"").trim(),p=String(r[cP]??"").trim(),s=p.toUpperCase();
  if(!cod&&!p)continue;
  if(cabCod.includes(cabNormal(cod))&&cabProd.includes(cabNormal(p)))continue;
  if(!cod&&/^total(?:\s|$)/i.test(p))continue;
  if(!cod||!p)throw new Error("linha "+(index+1)+" tem código ou descrição ausente. Revise o arquivo; nenhum item foi importado parcialmente");
  const hp=s.match(/(\d+)\s*HP/),k=s.match(/(\d+)\s*K\s*BTU/),b=s.match(/([\d.]+)\s*BTU/);
  out.push({codigo:typeof raw==="number"?raw:cod,produto:p,und:r[cU]||"",fab:r[cF]||"",cod_fab:r[cCF]||"",classe:r[cCl]||"",
   tipo:tipoEquipamento({produto:p,cod_fab:r[cCF]}),
   btu:k?k[1]*1000:b?(parseInt(b[1].replace(/\./g,""))||null):null,hp:hp?+hp[1]:null,saldo:saldoPlanilha(r[cSaldo],index+1)});
 }
 const dataRelatorio=String(rows[t+1]?.[cSaldo]??"").trim();
 return{lista:out,ref:/^\d{2}[/-]\d{2}[/-]\d{2,4}$/.test(dataRelatorio)?dataRelatorio:new Date().toLocaleString("pt-BR")};
}

/* ---------- agrupamento por modelo ---------- */
let abertas=new Set();
const modeloEst=e=>{
 for(const text of [e.cod_fab,e.produto]){
  const match=String(text||"").trim().toUpperCase().match(/\b([AC]R(?:NU|UN)[A-Z0-9.\-]+)\b/);
  if(match)return match[1];
 }
 return String(e.cod_fab||"").trim().toUpperCase();
};
const chaveModelo=value=>{
 const m=String(value||"").trim().toUpperCase(),g=m.match(/^[AC](R(?:NU|UN)[A-Z0-9.\-]+)$/);
 return g?g[1]:value;
};
function tipoEquipamento(e){
 const m=modeloEst(e),s=String(e.produto||"").toUpperCase();
 // A descrição explícita tem prioridade quando o código do relatório diverge.
 if(s.includes("EVAP"))return "Evaporadora";
 if(/\bCOND(?:ENSADOR[A-Z]*)?\b/.test(s))return "Condensadora";
 if(/^[AC]RUN/.test(m))return "Condensadora";
 if(/^[AC]RNU/.test(m))return "Evaporadora";
 return e.tipo||"Outros";
}
const chaveEst=e=>{const m=modeloEst(e);
 return /^[A-Z0-9][A-Z0-9.\-]{4,}$/.test(m)&&!m.endsWith("-")?chaveModelo(m):"cod:"+e.codigo;
};
function prep(){const antigas=new Map(),porCodigo=new Map();
 S.estoque.forEach(e=>{const anterior=e.chave;e.chave=chaveEst(e);e.tipo=tipoEquipamento(e);
  if(anterior)antigas.set(anterior,e.chave);porCodigo.set(String(e.codigo),e.chave);
 });
 S.itens.forEach(i=>{i.chave=antigas.get(i.chave)||porCodigo.get(String(i.codigo))||chaveModelo(i.chave)||"cod:"+i.codigo;});
 // Pedidos e entregas preservam as referências históricas registradas.
}
function grupos(){const g={};
 S.estoque.forEach(e=>{const x=g[e.chave]||(g[e.chave]={chave:e.chave,tipo:e.tipo,saldo:0,vars:[],btu:0,hp:0,nome:e.produto,busca:[]});
  x.saldo+=e.saldo;x.busca.push(e.produto,e.cod_fab,e.classe,modeloEst(e));x.vars.push(modeloEst(e)||e.produto);x.btu=Math.max(x.btu,e.btu||0);x.hp=Math.max(x.hp,e.hp||0)});
 for(const k in g){const x=g[k];x.vars=[...new Set(x.vars)];x.label=k.startsWith("cod:")?x.nome:x.vars.length>1&&/^R(?:NU|UN)/.test(k)?"A"+k+" / C"+k:x.vars[0]}
 return g}
function correspondeBusca(g,query){
 const normalizar=value=>String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 const q=normalizar(query).trim();if(!q)return true;
 const termos=[g.label,...g.vars,...(g.busca||[])].map(normalizar);
 const compacto=value=>value.replace(/[\s.\-_/]/g,"");
 return termos.some(t=>t.includes(q)||compacto(t).includes(compacto(q)));
}
const lab=(c,G)=>G[chaveModelo(c)]?.label||(String(c).replace("cod:","código ")+" (fora do Supra)");

/* ---------- cálculos ---------- */
function compras(){const G=grupos(),disp={},cons={},det={},obras=[];Object.values(G).forEach(g=>disp[g.chave]=g.saldo);
 const alo={};for(const st of ["Reservado","Previsto"])S.obras.forEach(o=>S.itens.filter(i=>i.obra==o.id&&i.status==st).forEach(i=>{const u=Math.min(Math.max(disp[i.chave]||0,0),i.qtd);disp[i.chave]=(disp[i.chave]||0)-u;alo[i.id]=u}));
 S.obras.forEach(o=>{const linhas=S.itens.filter(i=>i.obra==o.id).map(i=>{const compra=COMPRA.includes(i.status);let usa=0,falta=0;
   if(compra){usa=alo[i.id]||0;falta=i.qtd-usa;cons[i.chave]=(cons[i.chave]||0)+i.qtd;const dd=det[i.chave]||(det[i.chave]={}),x=dd[o.nome]||(dd[o.nome]={obra:o.nome,qtd:0,usa:0,falta:0});x.qtd+=i.qtd;x.usa+=usa;x.falta+=falta}
   return{...i,modelo:lab(i.chave,G),compra,usa,falta}});
  obras.push({obra:o,linhas,falta:linhas.reduce((a,l)=>a+l.falta,0)})});
 const cl=Object.keys(cons).map(c=>({modelo:lab(c,G),tipo:G[c]?.tipo||"?",necessario:cons[c],saldo:G[c]?.saldo||0,comprar:Math.max(0,cons[c]-(G[c]?.saldo||0)),chave:c,onde:Object.values(det[c]||{}).filter(x=>x.falta>0)})).filter(r=>r.comprar>0).sort((a,b)=>b.comprar-a.comprar);
 return{cl,obras}}
function conferir(){const G=grupos();
 return S.obras.map(o=>{const it=S.itens.filter(i=>i.obra==o.id),sm=(tp,f)=>it.filter(i=>G[i.chave]?.tipo==tp).reduce((a,i)=>a+(f?(G[i.chave][f]||0):1)*i.qtd,0),
  ev=sm("Evaporadora"),cd=sm("Condensadora"),al=[];
  if(ev&&!cd)al.push("tem evaporadora e nenhuma condensadora");if(cd&&!ev)al.push("tem condensadora e nenhuma evaporadora");

  return{obra:o.nome,ev,btu:sm("Evaporadora","btu"),cd,hp:sm("Condensadora","hp"),al:al.join("; ")||"ok"}})}

async function baixar(nome,data){try{const d=await window.claude?.use("downloads");
 if(d)await d.save({filename:nome,data});
 else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=nome;document.body.appendChild(a);a.click();a.remove()}
 flash("Arquivo salvo: "+nome)}catch(e){if(e.code!="declined")flash("Não foi possível baixar ("+(e.code||e.message)+")")}}

 if(a=="aba"){aba=b.dataset.a;render()}
 else if(a=="addObra"){const n=$("#on").value.trim();if(!n)return flash("Digite o nome da obra.");
  if(S.obras.some(o=>o.nome.toLowerCase()==n.toLowerCase()))return flash("Já existe uma obra com esse nome.");
  const anterior=JSON.stringify(S);b.disabled=true;
  try{
   S.obras.push({id:proximoId(),nome:n,end:$("#oe").value,resp:$("#or").value});
   if(await save())render();else S=JSON.parse(anterior);
  }catch(error){S=JSON.parse(anterior);flash(error.message)}finally{b.disabled=false}}
 else if(a=="delObra"){if((S.pedidos||[]).some(p=>p.obraId==id))return flash("Esta obra possui pedidos registrados e não pode ser excluída.");if(pendDel!=id){pendDel=id;return render()}S.obras=S.obras.filter(o=>o.id!=id);S.itens=S.itens.filter(i=>i.obra!=id);pendDel=null;save();render()}
 else if(a=="addItem"){const c=$("#pp").value;if(!c)return flash("Escolha um produto na lista.");
  S.itens.push({id:proximoId(),obra:obraSel,chave:c,qtd:Math.max(1,parseInt($("#qq").value)||1),amb:$("#am").value,status:$("#ss").value,serie:$("#se").value});save();render()}
 else if(a=="delItem"){S.itens=S.itens.filter(i=>i.id!=id);save();render()}
else if(a=="csvCompras"){const{cl,obras}=compras();
  baixar("lista_de_compras.csv",csv([["TOTAL A COMPRAR"],["Modelo","Tipo","Necessário","Saldo Supra","Comprar"],...cl.map(r=>[r.modelo,r.tipo,r.necessario,r.saldo,r.comprar]),["TOTAL DE MÁQUINAS FALTANTES","","","",cl.filter(r=>r.tipo=="Evaporadora"||r.tipo=="Condensadora").reduce((a,r)=>a+r.comprar,0)],[],
   ["POR OBRA"],["Obra","Modelo","Ambiente","Status","Qtd","Do estoque","Falta"],...obras.flatMap(x=>x.linhas.map(l=>[x.obra.nome,l.modelo,l.amb,l.status,l.qtd,l.usa,l.falta]))]))}
  else if(a=="bkpSave")baixarBackupServidor()});

  if(f=="qt")i.qtd=Math.max(1,parseInt(t.value)||1);else if(f=="st")i.status=t.value;else if(f=="am")i.amb=t.value;else if(f=="sr")i.serie=t.value;save()}
 else if(t.id=="arq"&&t.files[0]){try{const{lista,ref}=extrair(await linhas(t.files[0]));if(!lista.length)throw new Error("nenhum produto encontrado");

 else if(t.id=="bk"&&t.files[0]){if(!confirm("Restaurar o backup substituirá todos os dados atuais do servidor. Deseja continuar?"))return;try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.obras)||!Array.isArray(j.itens)||!Array.isArray(j.estoque))throw new Error("arquivo não é um backup deste app");
  if(await restaurarBackupServidor(j))flash("Backup restaurado.")}catch(x){flash("Backup inválido: "+x.message)}}});
